name: Egress agent

# The egress agent of onek8s/aks-ai-agents (design D59) on the dev environment: it reads the connections the hub
# firewall denied from the cells, finds the pod behind each source address - the firewall-egress cell (az3) has no
# overlay, so a pod keeps its own address up to the firewall - and opens one pull request per application namespace
# to onek8s/azure-landing-zone, adding the destinations to that application's firewall rules
# (stacks/platform-extensions/firewall-applications/dev-int/<namespace>.yaml). A human reviews and merges it; the
# landing zone's Platform workflow applies it, and labfw enforces it within minutes. The agent never allows anything
# itself.
#
# The model is the expensive part, so everything else runs in code (aks-ai-agents `aks-agent egress`), with a state
# file kept between runs in the Actions cache (pending, merged and rejected proposals, the sources already seen, the
# last ingestion time):
#
#   new      what Log Analytics ingested after the last processed ingestion time (the checkpoint in the state), never
#            more than `max_lookback_hours` (3) back - a first run or one after a pause starts there, older events
#            are ignored. Denials only, unless `include_allowed` (a firewall that still allows by default, whose log
#            keeps allowed lines: azure-landing-zone labfw.log_analytics.denied_only = false). Bare IPs, nodes,
#            platform pods and sources of namespaces with a pending proposal are dropped. No cluster, no model.
#            Nothing new: the run ends here.
#   propose  only when `new` found something: maps the sources to pods, drops what is already in the firewall file,
#            an open agent PR or the state, and starts the model only for what is left.
#
# Log Analytics (through the hub's Azure Monitor Private Link scope), Foundry and the API servers have no public
# network access: the job is on the labfw VPN from the start.
#
# What it reads, all with the dev deployment identity's read access:
#   - labfw's denied connections in Log Analytics (workspace log-labfw-<region> in sub-hub, table
#     LabfwFirewallLog_CL, filled by the Azure Monitor Agent on labfw's VM; azure-landing-zone modules/labfw logs.tf)
#     with its Reader on sub-hub - an Azure Firewall's AZFW tables the same way;
#   - the cells' pods, nodes and namespaces (kubectl read verbs) through the labfw VPN;
#   - the repositories.
# The model is on Microsoft Foundry (shared/ ai_foundry, Entra ID, private endpoint). Pull requests are opened with the
# organisation's GH_OWNER token: the lab has no GitHub App per agent yet (the design gives each agent its own); the
# agent's tool grants limit it to the landing zone's per-application files. So, like Lab admin, by hand only - no
# schedule while it holds an owner credential. The run's audit trail is an artifact.

on:
  workflow_dispatch:
    inputs:
      max_lookback_hours:
        description: "Continue from the last processed log line, but never more than ... hours back"
        default: "3"
      include_allowed:
        description: "Allowed flows too (a firewall that still allows by default)"
        type: boolean
        default: false
      forget_declined:
        description: "Look again at flows the model proposed nothing for (skipped for a day otherwise)"
        type: boolean
        default: false
      dry_run:
        description: "Record the pull request instead of opening it"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  actions: write # the state cache

# One run at a time - the state file moves forward linearly - on the labfw VPN's runner peer
# (.github/actions/labfw-vpn), which one job holds at a time
concurrency:
  group: labfw-vpn
  cancel-in-progress: false

env:
  STATE_CACHE: egress-agent-state

jobs:
  egress:
    name: egress agent
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    env:
      RESOURCE_GROUP: rg-aks-dev
      HUB_SUBSCRIPTION_ID: 56b07081-ca7e-4343-b000-bc0998a8c347
      FIREWALL_WORKSPACE_GROUP: rg-hub-labfw-germanywestcentral
      FIREWALL_WORKSPACE: log-labfw-germanywestcentral
    steps:
      - name: Check the inputs
        env:
          MAX_LOOKBACK_HOURS: ${{ inputs.max_lookback_hours || '3' }}
        run: |
          [[ "$MAX_LOOKBACK_HOURS" =~ ^[0-9]{1,2}$ ]] && [ "$MAX_LOOKBACK_HOURS" -ge 1 ] && [ "$MAX_LOOKBACK_HOURS" -le 24 ] || { echo "::error::max_lookback_hours must be 1 to 24"; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: onek8s/aks-ai-agents
          path: aks-ai-agents

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the agents
        run: pip install --quiet ./aks-ai-agents

      - name: The previous run's state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: ${{ env.STATE_CACHE }}-${{ github.run_id }}
          restore-keys: ${{ env.STATE_CACHE }}-

      - name: Sign in to Azure (GitHub OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Log Analytics, Foundry and the API servers, through the hub firewall's VPN
      - uses: ./.github/actions/labfw-vpn
        with:
          config: ${{ secrets.LABFW_VPN_GITHUB_RUNNERS }}

      - name: New denials
        id: new
        working-directory: aks-ai-agents
        env:
          AKS_AGENT_PLATFORM: config/onek8s-dev.yaml
          AKS_AGENT_ENV: dev
          AKS_AGENT_GITHUB_TOKEN: ${{ secrets.GH_OWNER }}
          MAX_LOOKBACK_HOURS: ${{ inputs.max_lookback_hours || '3' }}
          INCLUDE_ALLOWED: ${{ inputs.include_allowed && 'true' || '' }}
          FORGET_DECLINED: ${{ inputs.forget_declined && 'true' || '' }}
        run: |
          set -euo pipefail
          mkdir -p ../state
          export AKS_AGENT_FIREWALL_WORKSPACE=$(az monitor log-analytics workspace show --subscription "$HUB_SUBSCRIPTION_ID" -g "$FIREWALL_WORKSPACE_GROUP" -n "$FIREWALL_WORKSPACE" --query customerId -o tsv)
          args=(--state ../state/egress.json --out ../state/new.json --max-lookback-minutes "$((MAX_LOOKBACK_HOURS * 60))")
          [ -z "$INCLUDE_ALLOWED" ] || args+=(--include-allowed)
          [ -z "$FORGET_DECLINED" ] || args+=(--forget-declined)
          aks-agent egress new "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: steps.new.outputs.new != '0'
        with:
          repository: onek8s/onek8s.github.io
          path: onek8s.github.io

      - name: Kubernetes credentials (read verbs only)
        if: steps.new.outputs.new != '0'
        run: |
          set -euo pipefail
          sudo az aks install-cli --only-show-errors >/dev/null
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          for cluster in $(az aks list -g "$RESOURCE_GROUP" --query "[?starts_with(name, 'aks-dev-int-stateless')].name" -o tsv); do
            az aks get-credentials -g "$RESOURCE_GROUP" -n "$cluster" --file "$KUBECONFIG" --only-show-errors
          done
          kubelogin convert-kubeconfig -l azurecli
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"

      - name: Propose
        if: steps.new.outputs.new != '0'
        working-directory: aks-ai-agents
        env:
          AKS_AGENT_PLATFORM: config/onek8s-dev.yaml
          AKS_AGENT_ENV: dev
          AKS_AGENT_DESIGN: ${{ github.workspace }}/onek8s.github.io
          AKS_AGENT_DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
          AKS_AGENT_GITHUB_TOKEN: ${{ secrets.GH_OWNER }}
        run: |
          set -euo pipefail
          aks-agent egress propose --state ../state/egress.json --flows ../state/new.json | tee "$RUNNER_TEMP/result.txt"
          { echo '### Egress agent'; echo '```'; cat "$RUNNER_TEMP/result.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the state
        if: always() && steps.new.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: state
          key: ${{ env.STATE_CACHE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v7
        if: always() && steps.new.outputs.new != '0'
        with:
          name: egress-agent-run
          path: aks-ai-agents/runs
          retention-days: 30
          if-no-files-found: ignore

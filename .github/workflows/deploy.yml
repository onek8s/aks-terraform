name: Deploy

# Plans, and on request applies, one of the dev environment's Terraform stacks, chosen by the `stack`
# input. Started by hand (or called by another workflow): choose `plan` to see what would change,
# `apply` to change it. An apply plans first and applies exactly that plan, so what the log shows is
# what was done. `destroy` deletes a cluster stack the same way - plan first, then exactly that - for
# a change a cluster cannot take in place, such as its nodes' architecture: destroy, then apply with
# allow_empty_state. dev-shared is never destroyed from here.
#
#   dev-shared           shared/ with shared/envs/dev.tfvars: the resource group, the cells' networks,
#                        the platform and zone Key Vaults, the namespaces' shared identities, the
#                        internal zones' private DNS, the container registry and its images and the
#                        external zones' Traffic Manager profiles. Applied first.
#   dev-int-stateless-az2    the repository root with envs/dev-int-stateless-az2.tfvars: aks-dev-int-stateless-az2,
#                        the lab's running cell (internal, int-fi, germanywestcentral, behind labfw).
#   dev-int-stateless-az3    the same in availability zone 3 without an overlay (design D59): pods on their
#                        zone's node subnet in 100.64.0.0/16, every egress decided by labfw; int-se.
#   dev-int-stateless-az1    the same in availability zone 1: disabled in shared/ (zone 1 is not available
#                        to sub-aks-dev in germanywestcentral).
#   dev-int-stateful         the repository root with envs/dev-int-stateful.tfvars: aks-dev-int-stateful (defined,
#                        not deployed for now).
#
# After an apply of dev-shared, Sign images signs the registry's new images (job sign-images). The
# Isolation tests and the CIS benchmark run by hand only, when the user asks for them.
#
# Each stack has a state of its own - so a cluster can be destroyed and built again without touching
# the shared resources or the other clusters - in the azurerm backend of its terraform.tf, as
# `<stack>.tfstate` in the `tfstate` container of the storage account named by the variables
#
#   TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT
#
# in sub-aks-dev itself, so a lab reset of the OneK8s build tenant (azure-landing-zone) takes the
# state with the resources. The first run creates the account when it is missing. The backend reads
# the state with the account's key, which it looks up with the run's Azure identity.
#
# A run that finds the state empty stops before planning unless `allow_empty_state` is set: an empty
# state behind an existing cluster means the backend settings are wrong, and a plan against it would
# try to create everything again.
#
# Credentials: the `dev` GitHub environment's (or the repository's) variables AZURE_CLIENT_ID,
# AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID. With the secret AZURE_CLIENT_SECRET they are a service
# principal; without it, an identity federated with this repository's `dev` environment (GitHub OIDC,
# nothing secret stored). The identity needs Owner on sub-aks-dev - the configuration creates role
# assignments for the clusters' identities - and the public zone's resource group, rg-onek8s-dns, is
# in the same subscription.
#
# The Flux repositories (onek8s/aks-fluxcd-platform, onek8s/aks-fluxcd-example) are public and read
# without a credential: no Git token is passed to Flux, so none can go stale.
on:
  workflow_dispatch:
    inputs:
      stack:
        description: "dev-shared (apply first), or a cluster: dev-int-stateless-az2 (running), dev-int-stateless-az3 (firewall egress, no overlay), dev-int-stateless-az1 (disabled), dev-int-stateful"
        required: true
        default: "dev-shared"
        type: choice
        options: [dev-shared, dev-int-stateless-az2, dev-int-stateless-az3, dev-int-stateless-az1, dev-int-stateful]
      action:
        description: "plan shows the changes; apply makes them; destroy deletes a cluster"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]
      allow_empty_state:
        description: "Continue with an empty state (a first deployment only)"
        required: false
        default: false
        type: boolean
  # The same, from another workflow - one that applies dev-shared and then the clusters.
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      action:
        required: true
        type: string
      allow_empty_state:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # GitHub OIDC, when there is no client secret

env:
  # Keep in step with pr.yml.
  TERRAFORM_VERSION: "1.14.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    name: ${{ inputs.action }} ${{ inputs.stack }}
    runs-on: ubuntu-latest
    # The `dev` GitHub environment, for every stack: its protection rules (required reviewers,
    # branches) hold the run, and its variables and secrets win over the repository's.
    environment: dev
    concurrency:
      # One run at a time against a state; never cancel one mid-apply. The backend's blob lease
      # protects the state as well, but a queued run is clearer than a failed lock.
      group: terraform-${{ inputs.stack }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ endsWith(inputs.stack, '-shared') && 'shared' || '.' }}
    env:
      TF_STACK: ${{ inputs.stack }}
      # The variables file, relative to the stack's directory.
      VAR_FILE: ${{ inputs.stack == 'dev-shared' && 'envs/dev.tfvars' || format('envs/{0}.tfvars', inputs.stack) }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_USE_OIDC: ${{ secrets.AZURE_CLIENT_SECRET == '' }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check required configuration
        run: |
          missing=""
          [ -n "$ARM_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$ARM_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$ARM_SUBSCRIPTION_ID" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -n "$TF_STATE_RESOURCE_GROUP" ] || missing="$missing TF_STATE_RESOURCE_GROUP"
          [ -n "$TF_STATE_STORAGE_ACCOUNT" ] || missing="$missing TF_STATE_STORAGE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables/secrets:$missing" >&2
            echo "See the header of .github/workflows/deploy.yml." >&2
            exit 1
          fi

      - name: Log in to Azure (service principal)
        if: env.ARM_CLIENT_SECRET != ''
        run: |
          az login --service-principal --username "$ARM_CLIENT_ID" --password "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      - name: Log in to Azure (GitHub OIDC)
        if: env.ARM_CLIENT_SECRET == ''
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      # The resource providers and the preview feature the configuration needs (README, "Prerequisites"),
      # registered in the environment's subscription - an empty one from the landing zone has few of
      # them. Idempotent: a registered provider is left alone. The feature waits until it is registered,
      # then the provider is registered again, as AKS asks for a feature to take effect.
      - name: Register resource providers
        run: |
          set -euo pipefail
          providers="Microsoft.ContainerService Microsoft.KubernetesConfiguration Microsoft.ContainerRegistry Microsoft.KeyVault Microsoft.ManagedIdentity Microsoft.Network Microsoft.Compute Microsoft.Storage Microsoft.PolicyInsights Microsoft.OperationalInsights Microsoft.Insights Microsoft.Consumption Microsoft.CognitiveServices"
          for p in $providers; do
            [ "$(az provider show -n "$p" --query registrationState -o tsv)" = Registered ] || az provider register -n "$p" -o none
          done
          # The managed Gateway API CRDs, encryption at host on the nodes (design section 4.2), Image
          # Integrity (section 2.7), and AKS's managed GPU stack on the zones' GPU nodes (section 2.3).
          for pair in Microsoft.ContainerService/ManagedGatewayAPIPreview Microsoft.Compute/EncryptionAtHost \
            Microsoft.ContainerService/EnableImageIntegrityPreview Microsoft.ContainerService/ManagedGPUExperiencePreview; do
            namespace="${pair%/*}"; feature="${pair#*/}"
            if [ "$(az feature show --namespace "$namespace" --name "$feature" --query properties.state -o tsv)" != Registered ]; then
              az feature register --namespace "$namespace" --name "$feature" -o none
              for _ in $(seq 1 40); do
                [ "$(az feature show --namespace "$namespace" --name "$feature" --query properties.state -o tsv)" = Registered ] && break
                sleep 30
              done
              az provider register -n "$namespace" -o none
            fi
          done
          for _ in $(seq 1 40); do
            pending=""
            for p in $providers; do
              [ "$(az provider show -n "$p" --query registrationState -o tsv)" = Registered ] || pending="$pending $p"
            done
            [ -z "$pending" ] && exit 0
            echo "Waiting for:$pending"; sleep 30
          done
          echo "::error::Not registered:$pending"; exit 1

      # Everything Terraform reads and writes past Azure Resource Manager is private: the state account,
      # the vaults (keys, certificates, secrets), the registry and the API servers have no public
      # network access, so the runner joins the hub firewall's VPN before the first of them, on a peer
      # of its own (github-deploy; the other VPN workflows share github-runners) for the whole run.
      - name: Join the labfw VPN
        uses: ./.github/actions/labfw-vpn
        with:
          config: ${{ secrets.LABFW_VPN_GITHUB_DEPLOY }}

      # The state lives in the environment's own subscription. Idempotent: a run that finds the account
      # changes nothing. Entra ID only (no shared key): the backend reads the state as the run's
      # identity, which holds Storage Blob Data Contributor on the account. A new account answers on its
      # public endpoint until dev-shared gives it its private endpoint and turns that off
      # (shared/ state_storage).
      - name: Prepare the state storage
        run: |
          set -euo pipefail
          if ! az storage account show -g "$TF_STATE_RESOURCE_GROUP" -n "$TF_STATE_STORAGE_ACCOUNT" -o none 2>/dev/null; then
            location="$(sed -nE 's/^location[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' "$VAR_FILE" | head -n 1)"
            az group create -n "$TF_STATE_RESOURCE_GROUP" -l "$location" -o none
            az storage account create -g "$TF_STATE_RESOURCE_GROUP" -n "$TF_STATE_STORAGE_ACCOUNT" -l "$location" \
              --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 --allow-blob-public-access false \
              --allow-shared-key-access false -o none
            az storage account blob-service-properties update -g "$TF_STATE_RESOURCE_GROUP" -n "$TF_STATE_STORAGE_ACCOUNT" \
              --enable-versioning true --enable-delete-retention true --delete-retention-days 7 -o none
            az role assignment create --assignee "$ARM_CLIENT_ID" --role "Storage Blob Data Contributor" \
              --scope "$(az storage account show -g "$TF_STATE_RESOURCE_GROUP" -n "$TF_STATE_STORAGE_ACCOUNT" --query id -o tsv)" -o none
            sleep 60 # the role assignment reaches the data plane
          fi
          az storage container create --name tfstate --account-name "$TF_STATE_STORAGE_ACCOUNT" --auth-mode login -o none

      - name: Refuse to destroy the shared resources
        if: inputs.action == 'destroy' && endsWith(inputs.stack, '-shared')
        run: |
          echo "::error::${TF_STACK} holds what every cluster shares; it is not destroyed from this workflow." >&2
          exit 1

      - name: Initialize
        run: |
          set -euo pipefail
          args=(
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP"
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
            -backend-config="key=${TF_STACK}.tfstate"
          )
          terraform init "${args[@]}"

      - name: Check the state
        env:
          ALLOW_EMPTY_STATE: ${{ inputs.allow_empty_state }}
        run: |
          set -euo pipefail
          count="$(terraform state list | wc -l)"
          echo "The state holds $count resources."
          if [ "$count" -eq 0 ] && [ "$ALLOW_EMPTY_STATE" != "true" ]; then
            echo "::error::The state ${TF_STACK}.tfstate is empty. Check TF_STATE_RESOURCE_GROUP and TF_STATE_STORAGE_ACCOUNT, or set allow_empty_state for a first deployment." >&2
            exit 1
          fi

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          set +e
          destroy=()
          if [ "${{ inputs.action }}" = destroy ]; then destroy=(-destroy); fi
          terraform plan -var-file="$VAR_FILE" "${destroy[@]}" -out=tfplan -detailed-exitcode -no-color | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          # 0: no changes, 2: changes, anything else: an error.
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Apply
        if: (inputs.action == 'apply' || inputs.action == 'destroy') && steps.plan.outputs.changes == 'true'
        run: terraform apply -no-color tfplan

      # A cluster build takes longer than the GitHub OIDC token the first sign-in used (about 5 minutes
      # valid), so the CLI signs in again before reading the cluster's credentials.
      - name: Log in to Azure again (GitHub OIDC)
        if: inputs.action == 'apply' && !endsWith(inputs.stack, '-shared') && env.ARM_CLIENT_SECRET == ''
        uses: azure/login@v3
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      # App Routing's istiod creates an Envoy Deployment, a LoadBalancer Service (a public IP), an
      # autoscaler, a disruption budget and a ServiceAccount, all `<gateway>-approuting-istio`, for
      # every Gateway of class approuting-istio. Once a Gateway names another class (gateway_implementation
      # = "traefik"), istiod is gone and nothing removes them: the Envoy pods crash without their
      # control plane, and the Service keeps a public IP whose selector (`gateway-name`) also matches
      # Traefik's pods. Deleted here by name, only for Gateways that no longer name approuting-istio -
      # never Traefik's own objects. Idempotent; runs on every apply of a cluster, changes or not.
      - name: Remove App Routing's leftovers from Gateways of another class
        if: inputs.action == 'apply' && !endsWith(inputs.stack, '-shared')
        run: |
          set -euo pipefail
          cluster=$(terraform output -raw name)
          resource_group=$(sed -n 's/^resource_group_name *= *"\(.*\)"/\1/p' "$VAR_FILE")
          sudo az aks install-cli --only-show-errors >/dev/null
          az aks get-credentials -g "$resource_group" -n "$cluster" --file "$RUNNER_TEMP/kubeconfig" --only-show-errors
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubelogin convert-kubeconfig -l azurecli
          kubectl get gateways.gateway.networking.k8s.io -A \
            -o jsonpath='{range .items[?(@.spec.gatewayClassName!="approuting-istio")]}{.metadata.namespace} {.metadata.name}{"\n"}{end}' |
            while read -r namespace gateway; do
              [ -n "$gateway" ] || continue
              echo "== ${namespace}/${gateway}-approuting-istio"
              kubectl -n "$namespace" delete --ignore-not-found --wait=false \
                deployment/"${gateway}-approuting-istio" \
                service/"${gateway}-approuting-istio" \
                horizontalpodautoscaler/"${gateway}-approuting-istio" \
                poddisruptionbudget/"${gateway}-approuting-istio" \
                serviceaccount/"${gateway}-approuting-istio"
            done

      - name: Summary
        if: always() && steps.plan.outcome != 'skipped'
        env:
          ACTION: ${{ inputs.action }}
          CHANGES: ${{ steps.plan.outputs.changes }}
        run: |
          {
            echo "### Terraform ${ACTION} - ${TF_STACK}"
            echo
            if [ -f plan.txt ]; then
              grep -E '^(Plan:|No changes\.|Changes to Outputs:)' plan.txt || true
            fi
            if [ "$ACTION" = "apply" ] && [ "$CHANGES" = "true" ]; then
              echo
              echo "Apply: ${{ job.status }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The registry builds new images when dev-shared changes their entries: sign whatever is unsigned
  # (design section 2.7) before a cluster runs it.
  sign-images:
    name: sign images
    needs: deploy
    if: inputs.action == 'apply' && inputs.stack == 'dev-shared'
    uses: ./.github/workflows/sign-images.yml
    secrets: inherit

name: Flux webhooks

# Points GitHub's push webhooks at the Flux receivers of every running cluster, so a merge reaches the
# clusters at once instead of at the next poll:
#
#   onek8s/aks-fluxcd-platform  -> Receiver flux-system/github  (GitRepository platform)
#   onek8s/aks-fluxcd-example   -> Receiver int-fi-example/github (the team's GitRepository
#                                  int-fi-example)
#
# one webhook per repository and running cluster with flux_github_webhook on (its envs/ tfvars, or its
# stack's common file), to https://<flux_webhook_hostname><receiver path>. The hostname is the
# platform's convention, flux-webhook-<cluster without aks->.<dns_zone_name>, served by the cluster's
# platform gateway; the path
# is the one notification-controller serves a Receiver on, /hook/sha256(token + name + namespace).
# The token is shared/'s, read from the platform vault (`flux-system--github-webhook-token`), and is each
# webhook's secret. Webhooks to a Flux receiver of a cluster that no longer runs or no longer has the
# webhook are deleted - all of them while shared/ has flux_github_webhook off (the lab's internal cells
# have no public entry point).
#
# Runs after every successful Deploy, by hand, and when this file changes on main.
#
# Credentials: the Azure identity of Deploy (GitHub environment `dev`) reads the token, over the labfw
# VPN (the vault takes no public network access, design D60); the secret
# GH_WEBHOOK_TOKEN - or the organization's GH_OWNER - manages the repositories' webhooks
# (Webhooks: read and write on both repositories).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/flux-webhooks.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: flux-webhooks
  cancel-in-progress: false

jobs:
  webhooks:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    # The labfw VPN's runner peer (.github/actions/labfw-vpn): one such run at a time
    concurrency:
      group: labfw-vpn
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-aks-dev
      VARS: shared/envs/dev.tfvars
      RECEIVERS: |
        onek8s/aks-fluxcd-platform github flux-system
        onek8s/aks-fluxcd-example github int-fi-example
    steps:
      - uses: actions/checkout@v7

      # For a name the variables file leaves to the naming policy (scripts/policy-name.sh).
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Webhook on?
        id: shared
        run: |
          webhook="$(sed -nE 's/^flux_github_webhook[[:space:]]*=[[:space:]]*(true|false).*/\1/p' "$VARS" | head -n 1)"
          echo "webhook=${webhook:-false}" >> "$GITHUB_OUTPUT"

      # The platform vault (no public network access), through the hub firewall's VPN
      - uses: ./.github/actions/labfw-vpn
        if: steps.shared.outputs.webhook == 'true'
        with:
          config: ${{ secrets.LABFW_VPN_GITHUB_RUNNERS }}

      - name: Sync the webhooks
        env:
          GH_TOKEN: ${{ secrets.GH_WEBHOOK_TOKEN || secrets.GH_OWNER }}
          NAMING_POLICY: ${{ secrets.NAMING_POLICY }}
          WEBHOOK: ${{ steps.shared.outputs.webhook }}
        run: |
          set -euo pipefail
          tfvar() { sed -nE "s/^$1[[:space:]]*=[[:space:]]*\"([^\"]*)\".*/\1/p" "$VARS" | head -n 1; }
          vault="$(tfvar key_vault_name)"; zone="$(tfvar dns_zone_name)"
          # A cluster's flux_github_webhook: its own tfvars, else its stack's common file (Deploy passes
          # envs/dev-int-stateless.tfvars before a dev-int-stateless-az<N> file), else off.
          cluster_webhook() {
            local file common value=""
            file="$(grep -l -E "^name[[:space:]]*=[[:space:]]*\"$1\"" envs/*.tfvars | head -n 1 || true)"
            if [ -n "$file" ]; then
              common="envs/$(basename "$file" .tfvars | sed -E 's/-az[0-9]+$//').tfvars"
              for f in "$file" "$common"; do
                [ -f "$f" ] && [ -z "$value" ] || continue
                value="$(sed -nE 's/^flux_github_webhook[[:space:]]*=[[:space:]]*(true|false).*/\1/p' "$f" | head -n 1)"
              done
            fi
            echo "${value:-false}"
          }
          if [ "$WEBHOOK" = true ]; then
            # The platform vault: named in the file, or by the naming policy (scripts/policy-name.sh).
            [ -n "$vault" ] || vault="$(scripts/policy-name.sh "$VARS" key_vault platform)"
            token="$(az keyvault secret show --vault-name "$vault" --name flux-system--github-webhook-token --query value -o tsv)"
            echo "::add-mask::$token"
            clusters=""
            for cluster in $(az aks list -g "$RESOURCE_GROUP" --query "[?powerState.code=='Running'].name" -o tsv); do
              if [ "$(cluster_webhook "$cluster")" = true ]; then clusters="$clusters $cluster"; fi
            done
          else
            # No webhook: Flux polls. Every Flux webhook left over is removed below.
            echo "flux_github_webhook is off in $VARS: removing the Flux webhooks"
            token=""; clusters=""
          fi
          echo "Running clusters with the webhook: $(echo $clusters)"
          while read -r repo name namespace; do
            [ -n "$repo" ] || continue
            path="/hook/$(printf '%s%s%s' "$token" "$name" "$namespace" | sha256sum | cut -d' ' -f1)"
            want=""
            for cluster in $clusters; do want="$want https://flux-webhook-${cluster#aks-}.${zone}${path}"; done
            existing="$(gh api "repos/$repo/hooks" --jq '.[] | "\(.id) \(.config.url)"')"
            for url in $want; do
              id="$(awk -v u="$url" '$2 == u {print $1}' <<<"$existing")"
              body="$(jq -n --arg url "$url" --arg secret "$token" \
                '{active: true, events: ["push"], config: {url: $url, content_type: "json", secret: $secret, insecure_ssl: "0"}}')"
              if [ -n "$id" ]; then
                gh api -X PATCH "repos/$repo/hooks/$id" --input - <<<"$body" >/dev/null; echo "updated $repo -> ${url%/hook/*}"
              else
                gh api -X POST "repos/$repo/hooks" --input - <<<"$(jq '. + {name: "web"}' <<<"$body")" >/dev/null; echo "created $repo -> ${url%/hook/*}"
              fi
            done
            # Webhooks to Flux receivers that are no longer wanted: another path, or a cluster that is gone.
            while read -r id url; do
              [ -n "$id" ] || continue
              case "$url" in https://flux-webhook-*/hook/*) ;; *) continue ;; esac
              grep -qxF "$url" <(tr ' ' '\n' <<<"$want") || { gh api -X DELETE "repos/$repo/hooks/$id"; echo "deleted $repo -> ${url%/hook/*}"; }
            done <<<"$existing"
          done <<<"$RECEIVERS"

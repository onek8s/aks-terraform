name: Cluster status

# Reports, read-only, what a cluster of the dev environment - chosen by the `cluster` input - is doing, for when something Flux deploys does
# not come up and nobody at hand has a kubeconfig. Started by hand. It changes nothing.
#
#   - the cluster's Kubernetes version and its managed Gateway API CRD bundle;
#   - the Flux configuration's compliance and the status of every object it reconciles;
#   - the records in the DNS zone;
#   - through `az aks command invoke`, the Gateways and HTTPRoutes and their status, the Flux
#     Kustomizations and HelmReleases, and the recent logs of Traefik and external-dns. This part
#     needs the principal to hold a Kubernetes RBAC role on the cluster (Azure Kubernetes Service RBAC
#     Reader at least); without one it is reported as forbidden and the rest still runs.
#
# Credentials: the same Azure identity and GitHub environment as Deploy - a service principal with
# AZURE_CLIENT_SECRET, or GitHub OIDC without it.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "The cluster to report on"
        required: true
        default: "aks-dev-stateless-az1"
        type: choice
        options: [aks-dev-stateless-az1, aks-dev-stateless-az2, aks-dev-stateful]

permissions:
  contents: read
  id-token: write # GitHub OIDC, when there is no client secret

jobs:
  status:
    name: status ${{ inputs.cluster || 'aks-dev-stateless-az1' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      # The clusters and their shared resources are all in one group; the public zone, created
      # outside Terraform, is in a group of its own.
      RESOURCE_GROUP: rg-aks-dev
      CLUSTER: ${{ inputs.cluster || 'aks-dev-stateless-az1' }}
      DNS_ZONE_RESOURCE_GROUP: rg-onek8s-dns
      DNS_ZONE: onek8s.lol
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Sign in to Azure (service principal)
        if: env.AZURE_CLIENT_SECRET != ''
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Sign in to Azure (GitHub OIDC)
        if: env.AZURE_CLIENT_SECRET == ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Cluster
        run: |
          az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" \
            --query '{kubernetesVersion: kubernetesVersion, currentKubernetesVersion: currentKubernetesVersion, provisioningState: provisioningState, powerState: powerState.code, ingressProfile: ingressProfile, autoUpgrade: autoUpgradeProfile}' \
            --output json

      - name: Flux configuration
        run: |
          id=$(az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" --query id --output tsv)
          az rest --method get \
            --url "https://management.azure.com${id}/providers/Microsoft.KubernetesConfiguration/fluxConfigurations/platform?api-version=2024-11-01" \
            --query '{complianceState: properties.complianceState, errorMessage: properties.errorMessage, sourceSyncedCommitId: properties.sourceSyncedCommitId, statuses: properties.statuses}' \
            --output json

      - name: DNS records
        continue-on-error: true
        run: |
          echo "== $DNS_ZONE"
          az network dns record-set list -g "$DNS_ZONE_RESOURCE_GROUP" -z "$DNS_ZONE" --query '[].{name: name, type: type, a: ARecords, txt: TXTRecords}' --output json

      - name: Inside the cluster
        continue-on-error: true
        # Straight from the runner, through the API server: no pod in the cluster, which a full node
        # could not schedule (`az aks command invoke` needs one). The principal signs in with Entra ID
        # through kubelogin, and needs a Kubernetes RBAC role on the cluster - Azure Kubernetes
        # Service RBAC Reader at least - or every command below comes back forbidden.
        run: |
          sudo az aks install-cli --only-show-errors >/dev/null
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$CLUSTER" --file "$RUNNER_TEMP/kubeconfig" --only-show-errors
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          # The Azure CLI's sign-in, whichever way it was made.
          kubelogin convert-kubeconfig -l azurecli
          # Report everything, whatever one command says.
          set +e -x
          kubectl version
          kubectl get nodes -o wide
          kubectl describe nodes | sed -n "/Allocatable:/,/Events:/p"
          kubectl get pods -A --field-selector=status.phase=Pending -o wide
          kubectl get resourcequota -A
          kubectl get pods -A -o 'custom-columns=NS:.metadata.namespace,POD:.metadata.name,PHASE:.status.phase,CPU:.spec.containers[*].resources.requests.cpu,MEM:.spec.containers[*].resources.requests.memory'
          kubectl get crd gateways.gateway.networking.k8s.io -o jsonpath="{.metadata.annotations}"; echo
          kubectl get crd | grep gateway.networking.k8s.io
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io -A
          kubectl get helmrelease -n flux-system traefik -o jsonpath="{.status.conditions}"; echo
          kubectl get pods -A -o wide | grep -E "NAMESPACE|traefik|external-dns|flux-system|ingress-gateway|example"
          kubectl describe pods -n traefik | tail -n 60
          kubectl get events -n traefik --sort-by=.lastTimestamp | tail -n 30
          kubectl get svc -n traefik -o wide
          kubectl get externalsecrets.external-secrets.io,secretstores.external-secrets.io -A
          kubectl get externalsecrets.external-secrets.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          kubectl get gitrepositories.source.toolkit.fluxcd.io -A
          kubectl get svc,networkpolicy -n flux-system -o wide
          kubectl get receivers.notification.toolkit.fluxcd.io -A
          # The path the repository's GitHub webhook calls, after https://<flux_webhook_hostname>.
          echo "webhookPath: $(kubectl get receivers.notification.toolkit.fluxcd.io -n flux-system github -o jsonpath='{.status.webhookPath}')"
          kubectl get receivers.notification.toolkit.fluxcd.io -n flux-system github -o jsonpath='{.status.conditions}'; echo
          kubectl get deploy -n flux-system notification-controller -o jsonpath="{.spec.template.spec.containers[0].args}"; echo
          kubectl get gatewayclass,gateway,httproute -A
          kubectl get gateway -n ingress-gateway -o yaml
          kubectl get httproute -A -o yaml
          kubectl logs -n traefik -l app.kubernetes.io/name=traefik --tail=80 --prefix
          kubectl logs -n external-dns deploy/external-dns --tail=80
          kubectl logs -n external-dns deploy/external-dns-public --tail=40
          kubectl get kustomization -n flux-system flux-webhook -o jsonpath="{.status.conditions}"; echo
          kubectl get helmrelease -n flux-system external-dns-public -o jsonpath="{.status.conditions}"; echo
          # The `example` tenant: its Flux configuration and the objects the extension made of it,
          # what the repository is applied as, what runs in the namespace and why not.
          kubectl get fluxconfigs.clusterconfig.azure.com -n example example -o jsonpath="{.status}"; echo
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io -n example -o jsonpath='{range .items[*]}{.metadata.name}: {.status.conditions}{"\n"}{end}'
          kubectl get gitrepositories.source.toolkit.fluxcd.io -n example -o jsonpath='{range .items[*]}{.metadata.name}: {.status.conditions}{"\n"}{end}'
          kubectl get rolebindings -n example -o wide
          kubectl get clusterrolebindings -o wide | grep -E "NAME|example"
          kubectl auth can-i --list --as=system:serviceaccount:example:flux-applier -n example
          kubectl auth can-i create namespaces --as=system:serviceaccount:example:flux-applier
          kubectl auth can-i create deployments -n ingress-gateway --as=system:serviceaccount:example:flux-applier
          kubectl get all,endpointslices,networkpolicy,secrets -n example -o wide
          kubectl describe pods -n example | tail -n 60
          kubectl get events -n example --sort-by=.lastTimestamp | tail -n 30
          kubectl get events -n flux-system --sort-by=.lastTimestamp | tail -n 40
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'

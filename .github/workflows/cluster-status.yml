name: Cluster status

# Reports, read-only, what a cluster of the dev environment - chosen by the `cluster` input - is doing, for when something Flux deploys does
# not come up and nobody at hand has a kubeconfig. Started by hand. It changes nothing.
#
#   - the cluster's Kubernetes version and its managed Gateway API CRD bundle;
#   - the Flux configuration's compliance and the status of every object it reconciles;
#   - the records in the DNS zone;
#   - the container registry's image builds: the latest runs, and the log of the latest failed one;
#   - the Azure Policy add-on: whether it is on, and the compliance the cluster reports to the
#     subscription's policy assignments (onek8s/azure-landing-zone, stacks/aks-policy);
#   - through `az aks command invoke`, the Gateways and HTTPRoutes and their status, the Flux
#     Kustomizations and HelmReleases, and the recent logs of Traefik and external-dns. This part
#     needs the principal to hold a Kubernetes RBAC role on the cluster (Azure Kubernetes Service RBAC
#     Reader at least); without one it is reported as forbidden and the rest still runs.
#
# Credentials: the same Azure identity and GitHub environment as Deploy - a service principal with
# AZURE_CLIENT_SECRET, or GitHub OIDC without it.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "The cluster to report on"
        required: true
        default: "aks-dev-stateless-az1"
        type: choice
        options: [aks-dev-stateless-az1, aks-dev-stateless-az2, aks-dev-stateful]

permissions:
  contents: read
  id-token: write # GitHub OIDC, when there is no client secret

jobs:
  status:
    name: status ${{ inputs.cluster || 'aks-dev-stateless-az1' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      # The clusters and their shared resources are all in one group; the public zone, created
      # outside Terraform, is in a group of its own.
      RESOURCE_GROUP: rg-aks-dev
      CLUSTER: ${{ inputs.cluster || 'aks-dev-stateless-az1' }}
      DNS_ZONE_RESOURCE_GROUP: rg-onek8s-dns
      DNS_ZONE: onek8s.lol
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Sign in to Azure (service principal)
        if: env.AZURE_CLIENT_SECRET != ''
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Sign in to Azure (GitHub OIDC)
        if: env.AZURE_CLIENT_SECRET == ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Cluster
        run: |
          az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" \
            --query '{kubernetesVersion: kubernetesVersion, currentKubernetesVersion: currentKubernetesVersion, provisioningState: provisioningState, powerState: powerState.code, ingressProfile: ingressProfile, autoUpgrade: autoUpgradeProfile}' \
            --output json

      - name: Flux configuration
        run: |
          id=$(az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" --query id --output tsv)
          az rest --method get \
            --url "https://management.azure.com${id}/providers/Microsoft.KubernetesConfiguration/fluxConfigurations/platform?api-version=2024-11-01" \
            --query '{complianceState: properties.complianceState, errorMessage: properties.errorMessage, sourceSyncedCommitId: properties.sourceSyncedCommitId, statuses: properties.statuses}' \
            --output json

      - name: Azure Policy
        continue-on-error: true
        # The add-on syncs the assignments every 15 minutes and reports back after its next audit
        # run, so a cluster whose add-on was just turned on shows no Kubernetes results for a while.
        run: |
          id=$(az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" --query id --output tsv)
          echo "== add-on"
          az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" --query 'addonProfiles.azurepolicy' --output json
          echo "== assignments on the subscription"
          az policy assignment list --query '[].{name: name, enforcementMode: enforcementMode}' --output table
          echo "== compliance of the cluster, by assignment"
          az policy state summarize --resource "$id" \
            --query 'policyAssignments[].{assignment: policyAssignmentId, nonCompliantResources: results.nonCompliantResources, nonCompliantPolicies: results.nonCompliantPolicies}' \
            --output table
          echo "== non-compliant policies of the cluster"
          az policy state list --resource "$id" --filter "complianceState eq 'NonCompliant'" \
            --query '[].{assignment: policyAssignmentName, definition: policyDefinitionReferenceId || policyDefinitionName}' \
            --top 100 --output table

      - name: Registry builds
        continue-on-error: true
        run: |
          registry=$(az acr list -g "$RESOURCE_GROUP" --query '[0].name' --output tsv)
          az acr task list-runs -r "$registry" --top 10 \
            --query '[].{run: runId, task: task, status: status, platform: platform.architecture, started: startTime}' --output table
          failed=$(az acr task list-runs -r "$registry" --run-status Failed --top 1 --query '[0].runId' --output tsv)
          if [ -n "$failed" ]; then
            echo "== log of $failed"
            az acr task logs -r "$registry" --run-id "$failed" | tail -n 80
          fi

      - name: DNS records
        continue-on-error: true
        run: |
          echo "== $DNS_ZONE"
          az network dns record-set list -g "$DNS_ZONE_RESOURCE_GROUP" -z "$DNS_ZONE" --query '[].{name: name, type: type, a: ARecords, txt: TXTRecords}' --output json
          for zone in $(az network private-dns zone list -g "$RESOURCE_GROUP" --query '[].name' -o tsv); do
            echo "== $zone (private)"
            az network private-dns record-set list -g "$RESOURCE_GROUP" -z "$zone" --query '[].{name: name, type: type, a: aRecords}' --output json
          done

      - name: Inside the cluster
        continue-on-error: true
        # Straight from the runner, through the API server: no pod in the cluster, which a full node
        # could not schedule (`az aks command invoke` needs one). The principal signs in with Entra ID
        # through kubelogin, and needs a Kubernetes RBAC role on the cluster - Azure Kubernetes
        # Service RBAC Reader at least - or every command below comes back forbidden.
        run: |
          sudo az aks install-cli --only-show-errors >/dev/null
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$CLUSTER" --file "$RUNNER_TEMP/kubeconfig" --only-show-errors
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          # The Azure CLI's sign-in, whichever way it was made.
          kubelogin convert-kubeconfig -l azurecli
          # Report everything, whatever one command says.
          set +e -x
          kubectl version
          kubectl get nodes -o wide -L platform/zone,karpenter.sh/capacity-type,kubernetes.azure.com/ebpf-host-routing
          kubectl describe nodes | sed -n "/Allocatable:/,/Events:/p"
          kubectl get pods -A --field-selector=status.phase=Pending -o wide
          kubectl get pods -A -o wide
          kubectl get nodepools.karpenter.sh,aksnodeclasses.karpenter.azure.com,nodeclaims.karpenter.sh
          kubectl get nodeclaims.karpenter.sh -o jsonpath='{range .items[*]}{.metadata.name}: {.status.conditions}{"\n"}{end}'
          kubectl get events -A --field-selector reason=FailedScheduling --sort-by=.lastTimestamp | tail -n 20
          kubectl get pods -n kube-system -l app=azure-policy -o wide
          kubectl get constrainttemplates
          kubectl get resourcequota -A
          kubectl get crd | grep -E "gateway.networking.k8s.io|cilium.io"
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io -A
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          kubectl get helmreleases.helm.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          kubectl get gitrepositories.source.toolkit.fluxcd.io -A
          # The gateways: one Traefik per isolation zone and the platform's, their load balancers,
          # Gateways and routes.
          kubectl get gatewayclass,gateway,httproute -A
          kubectl get gateway -A -o yaml
          kubectl get httproute -A -o yaml
          kubectl get svc -A -o wide | grep -E "NAMESPACE|LoadBalancer"
          for ns in $(kubectl get ns -o name | sed 's#namespace/##' | grep -E -- "-gateway$"); do
            kubectl logs -n "$ns" -l app.kubernetes.io/name=traefik --tail=30 --prefix
            kubectl get events -n "$ns" --sort-by=.lastTimestamp | tail -n 15
          done
          # External Secrets Operator: the platform's and one per zone, and every store and secret.
          kubectl get externalsecrets.external-secrets.io,secretstores.external-secrets.io -A
          kubectl get externalsecrets.external-secrets.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          kubectl get secretstores.external-secrets.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          for ns in $(kubectl get ns -o name | sed 's#namespace/##' | grep -E -- "-secrets$|^external-secrets$"); do
            kubectl logs -n "$ns" -l app.kubernetes.io/name=external-secrets --tail=20 --prefix
          done
          # Cilium: the platform's baseline and the applications' egress policies.
          kubectl get ciliumclusterwidenetworkpolicies,ciliumnetworkpolicies -A
          kubectl get ciliumnetworkpolicies -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions}{"\n"}{end}'
          kubectl get networkpolicy -A
          # external-dns and Flux's webhook receivers.
          kubectl logs -n external-dns -l app.kubernetes.io/instance=external-dns-ext --tail=40 --prefix
          kubectl logs -n external-dns -l app.kubernetes.io/instance=external-dns-int --tail=40 --prefix
          kubectl get receivers.notification.toolkit.fluxcd.io -A
          kubectl get receivers.notification.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.webhookPath} {.status.conditions}{"\n"}{end}'
          # The `example` team, in the ext-fi zone: its Flux configuration, what runs and why not.
          kubectl get fluxconfigs.clusterconfig.azure.com -n ext-fi-example ext-fi-example -o jsonpath="{.status}"; echo
          kubectl get all,endpointslices,networkpolicy -n ext-fi-example -o wide
          kubectl describe pods -n ext-fi-example | tail -n 60
          kubectl get events -n ext-fi-example --sort-by=.lastTimestamp | tail -n 30
          kubectl get events -n flux-system --sort-by=.lastTimestamp | tail -n 40

name: Cluster status

# Reports, read-only, what a cluster of the dev environment - chosen by the `cluster` input - is doing, for when something Flux deploys does
# not come up and nobody at hand has a kubeconfig. Started by hand. It changes nothing.
#
#   - the cluster's Kubernetes version and its managed Gateway API CRD bundle;
#   - the Flux configuration's compliance and the status of every object it reconciles;
#   - the records in the DNS zone;
#   - the container registry's image builds: the latest runs, and the log of the latest failed one;
#   - the Azure Policy add-on: whether it is on, and the compliance the cluster reports to the
#     subscription's policy assignments (onek8s/azure-landing-zone, stacks/aks-policy);
#   - Image Integrity: Ratify's pods, service account and workload identity, its configuration and
#     what the Notation signature policy reports;
#   - through `az aks command invoke`, the Gateways and HTTPRoutes and their status, the Flux
#     Kustomizations and HelmReleases, and the recent logs of the gateways and external-dns. This part
#     needs the principal to hold a Kubernetes RBAC role on the cluster (Azure Kubernetes Service RBAC
#     Reader at least); without one it is reported as forbidden and the rest still runs.
#
# Credentials: the same Azure identity and GitHub environment as Deploy - a service principal with
# AZURE_CLIENT_SECRET, or GitHub OIDC without it.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "The cluster to report on"
        required: true
        default: "aks-dev-int-stateless-az2"
        type: choice
        options: [aks-dev-int-stateless-az2, aks-dev-int-stateless-az3, aks-dev-int-stateless-az1, aks-dev-int-stateful]
      node_iptables:
        description: "Also dump every node's iptables rules (creates a debug pod per node)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # GitHub OIDC, when there is no client secret

# The labfw VPN's one runner peer (.github/actions/labfw-vpn): one such run at a time
concurrency:
  group: labfw-vpn
  cancel-in-progress: false

jobs:
  status:
    name: status ${{ inputs.cluster || 'aks-dev-int-stateless-az2' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      # The clusters and their shared resources are all in one group; the public zone, created
      # outside Terraform, is in a group of its own.
      RESOURCE_GROUP: rg-aks-dev
      CLUSTER: ${{ inputs.cluster || 'aks-dev-int-stateless-az2' }}
      DNS_ZONE_RESOURCE_GROUP: rg-onek8s-dns
      DNS_ZONE: onek8s.lol
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Sign in to Azure (service principal)
        if: env.AZURE_CLIENT_SECRET != ''
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Sign in to Azure (GitHub OIDC)
        if: env.AZURE_CLIENT_SECRET == ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Cluster
        run: |
          az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" \
            --query '{kubernetesVersion: kubernetesVersion, currentKubernetesVersion: currentKubernetesVersion, provisioningState: provisioningState, powerState: powerState.code, ingressProfile: ingressProfile, autoUpgrade: autoUpgradeProfile}' \
            --output json

      # What the region's vCPU quotas leave for another cell and for NAP's next nodes.
      - name: vCPU quota
        run: |
          az vm list-usage -l "$(az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" --query location -o tsv)" \
            --query "[?currentValue != '0' || contains(name.value, 'Regional') || contains(name.value, 'lowPriority')].{quota: name.localizedValue, used: currentValue, limit: limit}" \
            --output table

      - name: Flux configuration
        run: |
          id=$(az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" --query id --output tsv)
          az rest --method get \
            --url "https://management.azure.com${id}/providers/Microsoft.KubernetesConfiguration/fluxConfigurations/platform?api-version=2024-11-01" \
            --query '{complianceState: properties.complianceState, errorMessage: properties.errorMessage, sourceSyncedCommitId: properties.sourceSyncedCommitId, statuses: properties.statuses}' \
            --output json

      - name: Azure Policy
        continue-on-error: true
        # The add-on syncs the assignments every 15 minutes and reports back after its next audit
        # run, so a cluster whose add-on was just turned on shows no Kubernetes results for a while.
        run: |
          id=$(az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" --query id --output tsv)
          echo "== add-on"
          az aks show -g "$RESOURCE_GROUP" -n "$CLUSTER" --query 'addonProfiles.azurepolicy' --output json
          echo "== assignments on the subscription"
          az policy assignment list --query '[].{name: name, enforcementMode: enforcementMode}' --output table
          echo "== compliance of the cluster, by assignment"
          az policy state summarize --resource "$id" \
            --query 'policyAssignments[].{assignment: policyAssignmentId, nonCompliantResources: results.nonCompliantResources, nonCompliantPolicies: results.nonCompliantPolicies}' \
            --output table
          echo "== non-compliant policies of the cluster"
          az policy state list --resource "$id" --filter "complianceState eq 'NonCompliant'" \
            --query '[].{assignment: policyAssignmentName, definition: policyDefinitionReferenceId || policyDefinitionName}' \
            --top 100 --output table

      - name: Registry builds
        continue-on-error: true
        run: |
          registry=$(az acr list -g "$RESOURCE_GROUP" --query '[0].name' --output tsv)
          az acr task list-runs -r "$registry" --top 10 \
            --query '[].{run: runId, task: task, status: status, platform: platform.architecture, started: startTime}' --output table
          failed=$(az acr task list-runs -r "$registry" --run-status Failed --top 1 --query '[0].runId' --output tsv)
          if [ -n "$failed" ]; then
            echo "== log of $failed"
            az acr task logs -r "$registry" --run-id "$failed" | tail -n 80
          fi

      - name: DNS records
        continue-on-error: true
        run: |
          echo "== $DNS_ZONE"
          az network dns record-set list -g "$DNS_ZONE_RESOURCE_GROUP" -z "$DNS_ZONE" --query '[].{name: name, type: type, a: ARecords, txt: TXTRecords}' --output json
          for zone in $(az network private-dns zone list -g "$RESOURCE_GROUP" --query '[].name' -o tsv); do
            echo "== $zone (private)"
            az network private-dns record-set list -g "$RESOURCE_GROUP" -z "$zone" --query '[].{name: name, type: type, a: aRecords}' --output json
          done

      - uses: actions/checkout@v7

      # The private API server, through the hub firewall's VPN
      - uses: ./.github/actions/labfw-vpn

      - name: Inside the cluster
        continue-on-error: true
        # Straight from the runner, through the API server: no pod in the cluster, which a full node
        # could not schedule (`az aks command invoke` needs one). The principal signs in with Entra ID
        # through kubelogin, and needs a Kubernetes RBAC role on the cluster - Azure Kubernetes
        # Service RBAC Reader at least - or every command below comes back forbidden.
        run: |
          sudo az aks install-cli --only-show-errors >/dev/null
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$CLUSTER" --file "$RUNNER_TEMP/kubeconfig" --only-show-errors
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          # The Azure CLI's sign-in, whichever way it was made.
          kubelogin convert-kubeconfig -l azurecli
          # Report everything, whatever one command says.
          set +e -x
          kubectl version
          kubectl get nodes -o wide -L platform/zone,karpenter.sh/capacity-type,kubernetes.azure.com/ebpf-host-routing,platform/accelerator,node.kubernetes.io/instance-type
          # GPU nodes: what they offer (nvidia.com/gpu, from AKS's managed device plugin) and the
          # managed GPU stack's health conditions.
          kubectl get nodes -l platform/accelerator -o jsonpath='{range .items[*]}{.metadata.name}: gpu={.status.allocatable.nvidia\.com/gpu} dcgm={.metadata.labels.kubernetes\.azure\.com/dcgm-exporter} {range .status.conditions[?(@.type=="UnhealthyNvidiaDevicePlugin")]}{.type}={.status} {end}{"\n"}{end}'
          # Who owns each namespace and pays for it (Azure Policy namespace-ownership).
          kubectl get namespaces -o custom-columns='NAME:.metadata.name,TEAM:.metadata.labels.platform/team,COST_CENTER:.metadata.labels.platform/cost-center,ZONE:.metadata.labels.platform/zone,CONTACT:.metadata.annotations.platform/contact'
          kubectl describe nodes | sed -n "/Allocatable:/,/Events:/p"
          kubectl get pods -A --field-selector=status.phase=Pending -o wide
          kubectl get pods -A -o wide
          kubectl get nodepools.karpenter.sh,aksnodeclasses.karpenter.azure.com,nodeclaims.karpenter.sh
          kubectl get nodeclaims.karpenter.sh -o jsonpath='{range .items[*]}{.metadata.name}: {.status.conditions}{"\n"}{end}'
          kubectl get events -A --field-selector reason=FailedScheduling --sort-by=.lastTimestamp | tail -n 20
          kubectl get pods -n kube-system -l app=azure-policy -o wide
          kubectl get constrainttemplates
          # Policy violations, per constraint and object: what has to be fixed (or recorded) before a
          # rule in audit can deny. The add-on's PrintMutationsAnnotations constraints only note that a
          # mutation changed a pod, and are left out.
          kubectl get constraints -o json | jq -r '.items[] | select(.kind | test("(?i)printmutations") | not) | "\(.kind)/\(.metadata.name) \(.spec.enforcementAction): \(.status.totalViolations // 0) violations, audited \(.status.auditTimestamp // "never")", (.status.violations[:15][]? | "  \(.kind) \(.namespace // "-")/\(.name): \(.message | .[0:240])")'
          # Who writes the Secrets of the isolation zones' namespaces (the ESO-only rule is judged on
          # the admission request's user, which Gatekeeper's audit does not see): the managers of
          # each Secret, from its managed fields.
          kubectl get pods -n flux-system -o custom-columns='POD:.metadata.name,SERVICE_ACCOUNT:.spec.serviceAccountName'
          kubectl get secrets -A -o json --show-managed-fields | jq -r '.items[] | select(.metadata.namespace | test("^(int|ext)-(fi|se)-")) | "\(.metadata.namespace)/\(.metadata.name) \(.type) managers=\([.metadata.managedFields[]?.manager] | unique | join(","))"'
          kubectl get resourcequota -A
          kubectl get crd | grep -E "gateway.networking.k8s.io|cilium.io"
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io -A
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          kubectl get helmreleases.helm.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          kubectl get gitrepositories.source.toolkit.fluxcd.io -A
          # Pod right-sizing: the VPA add-on, each VPA's mode and target, and the pods' resize state
          # (PodResizePending / PodResizeInProgress) with the requests they run on now.
          kubectl get pods -n kube-system -l 'app in (vpa-recommender,vpa-updater,vpa-admission-controller)' -o wide
          kubectl get verticalpodautoscalers.autoscaling.k8s.io -A -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,MODE:.spec.updatePolicy.updateMode,TARGET:.status.recommendation.containerRecommendations[*].target'
          kubectl get pods -A -o jsonpath='{range .items[?(@.metadata.namespace!="kube-system")]}{.metadata.namespace}/{.metadata.name}: requests={.spec.containers[*].resources.requests} restarts={.status.containerStatuses[*].restartCount} conditions={.status.conditions[?(@.type=="PodResizePending")].reason}{.status.conditions[?(@.type=="PodResizeInProgress")].status}{"\n"}{end}'
          kubectl get events -A --field-selector reason=InPlaceResizedByVPA --sort-by=.lastTimestamp | tail -n 10
          # Image Integrity: Ratify - its service account, workload identity label and logs - its
          # configuration from the fleet, and what the signature policy reports.
          kubectl get pods -A -o json | jq -r '.items[] | select(.metadata.name | test("ratify")) | "\(.metadata.namespace)/\(.metadata.name) sa=\(.spec.serviceAccountName) wi=\(.metadata.labels["azure.workload.identity/use"] // "-") token=\([.spec.containers[].env[]? | select(.name == "AZURE_FEDERATED_TOKEN_FILE")] | length > 0) \(.status.phase)"'
          kubectl get keymanagementproviders.config.ratify.deislabs.io,stores.config.ratify.deislabs.io,verifiers.config.ratify.deislabs.io,policies.config.ratify.deislabs.io -o custom-columns='KIND:.kind,NAME:.metadata.name,SUCCESS:.status.issuccess,ERROR:.status.brieferror'
          for pod in $(kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' | grep ratify); do
            kubectl logs -n "${pod%%/*}" "${pod#*/}" --all-containers --tail=30 --prefix
          done
          kubectl get constraints -o json | jq -r '.items[] | select(((.metadata | tostring | test("cf426bb8")) or (.kind | test("(?i)ratify|notation|imageintegrity"))) and (.kind | test("(?i)printmutations") | not)) | "\(.kind)/\(.metadata.name) \(.spec.enforcementAction): \(.status.totalViolations // 0) violations, audited \(.status.auditTimestamp // "never")", "  match: \(.spec.match | tostring)", "  parameters: \(.spec.parameters | tostring)", (.status.violations[]? | "  \(.namespace)/\(.name): \(.message)")'
          # The gateways: one Gateway per isolation zone and the platform's, served by Traefik (a Helm
          # release and Flux configuration traefik-<gateway> each) or App Routing's Istio control
          # plane - their Deployments, autoscalers, load balancers and routes.
          kubectl get pods,hpa,configmap -n aks-istio-system -o wide 2>/dev/null || true
          kubectl get helmreleases.helm.toolkit.fluxcd.io -n flux-system -o wide | grep -E "NAME|traefik" || true
          kubectl get gatewayclass,gateway,httproute -A
          kubectl get gateway -A -o yaml
          kubectl get httproute -A -o yaml
          kubectl get svc -A -o wide | grep -E "NAMESPACE|LoadBalancer"
          for ns in $(kubectl get ns -o name | sed 's#namespace/##' | grep -E -- "-gateway$"); do
            kubectl get deploy,hpa,pdb,pods -n "$ns" -o wide
            kubectl get pods -n "$ns" -l gateway.networking.k8s.io/gateway-name -o jsonpath='{range .items[*]}{.metadata.name}: securityContext={.spec.securityContext} seccomp={.spec.containers[0].securityContext.seccompProfile}{"\n"}{end}'
            kubectl logs -n "$ns" -l gateway.networking.k8s.io/gateway-name --tail=30 --prefix
            kubectl get events -n "$ns" --sort-by=.lastTimestamp | tail -n 15
          done
          # External Secrets Operator: the platform's and one per zone, and every store and secret.
          kubectl get externalsecrets.external-secrets.io,secretstores.external-secrets.io -A
          kubectl get externalsecrets.external-secrets.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          kubectl get secretstores.external-secrets.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions[*].message}{"\n"}{end}'
          for ns in $(kubectl get ns -o name | sed 's#namespace/##' | grep -E -- "-secrets$|^external-secrets$"); do
            kubectl logs -n "$ns" -l app.kubernetes.io/name=external-secrets --tail=20 --prefix
          done
          # Observability and cost: Grafana's k8s-monitoring (Alloy with Fleet Management, node-exporter,
          # kube-state-metrics, Beyla's cache, OpenCost) and its secret from the vault.
          kubectl get pods,alloys.collectors.grafana.com -n infra-observability -o wide
          kubectl get externalsecret -n flux-system grafana-cloud -o jsonpath='{.status.conditions[*].message}'; echo
          for app in alloy-daemon alloy-operator kube-state-metrics beyla-k8s-cache opencost; do
            kubectl logs -n infra-observability -l "app.kubernetes.io/name=$app" --tail=15 --prefix
          done
          # Alloy without its once-a-minute clustering line, which hides everything else in a tail.
          kubectl logs -n infra-observability -l app.kubernetes.io/name=alloy-daemon -c alloy --tail=5000 --prefix \
            | grep -v 'rejoining peers' | tail -n 60
          # Fleet Management: the pipelines (name, enabled, matchers) and the collectors with their attributes.
          # A collector gets only the pipelines whose matchers fit its attributes; the chart sets `cluster` to the
          # cluster's name, so a pipeline matching another cluster's name sends nothing from this one.
          # No xtrace here: it would print the token before the mask is set.
          set +x
          fm_values="$(kubectl get secret -n flux-system grafana-cloud -o jsonpath='{.data.values\.yaml}' | base64 -d)"
          fm_url="$(yq '.collectorCommon.alloy.remoteConfig.url' <<<"$fm_values")"
          fm_user="$(yq '.collectorCommon.alloy.remoteConfig.auth.username' <<<"$fm_values")"
          fm_password="$(yq '.collectorCommon.alloy.remoteConfig.auth.password' <<<"$fm_values")"
          echo "::add-mask::$fm_password"
          unset fm_values
          for rpc in pipeline.v1.PipelineService/ListPipelines collector.v1.CollectorService/ListCollectors; do
            echo "Fleet Management $rpc:"
            curl -sS -u "$fm_user:$fm_password" -H 'Content-Type: application/json' -d '{}' "${fm_url%/}/$rpc" \
              | jq -c '((.pipelines // [])[] | {name, enabled, matchers}), ((.collectors // [])[] | {id, enabled, remoteAttributes, localAttributes}), (.code // empty), (.message // empty)'
          done
          unset fm_password
          set -x
          # Cilium: the platform's baseline and the applications' egress policies.
          kubectl get ciliumclusterwidenetworkpolicies,ciliumnetworkpolicies -A
          kubectl get ciliumnetworkpolicies -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.conditions}{"\n"}{end}'
          kubectl get networkpolicy -A
          # external-dns and Flux's webhook receivers.
          kubectl logs -n external-dns -l app.kubernetes.io/instance=external-dns-ext --tail=40 --prefix
          kubectl logs -n external-dns -l app.kubernetes.io/instance=external-dns-int --tail=40 --prefix
          kubectl get receivers.notification.toolkit.fluxcd.io -A
          kubectl get receivers.notification.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}: {.status.webhookPath} {.status.conditions}{"\n"}{end}'
          # The `example` team, in the ext-fi zone: its Flux configuration, what runs and why not.
          kubectl get fluxconfigs.clusterconfig.azure.com -n int-fi-example int-fi-example -o jsonpath="{.status}"; echo
          kubectl get all,endpointslices,networkpolicy -n int-fi-example -o wide
          kubectl describe pods -n int-fi-example | tail -n 60
          kubectl get events -n int-fi-example --sort-by=.lastTimestamp | tail -n 30
          kubectl get events -n flux-system --sort-by=.lastTimestamp | tail -n 40

      - name: Node iptables rules
        if: inputs.node_iptables
        continue-on-error: true
        run: |
          set +e
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl get nodes -o json | jq -r '.items[] | "\(.metadata.name) \(.metadata.labels | with_entries(select(.key | test("ebpf|iptables|acns"))))  \(.metadata.annotations | with_entries(select(.key | test("ebpf|iptables|acns"))))"'
          for node in $(kubectl get nodes -o name | sed 's#node/##'); do
            echo "== $node"
            pod="$(kubectl debug "node/$node" -n kube-system --profile=sysadmin --image=mcr.microsoft.com/azurelinux/base/core:3.0 -- chroot /host sh -c 'iptables-save; echo ---; ip6tables-save' 2>&1 | sed -nE 's/.*debugging pod ([^ ]+).*/\1/p')"
            echo "pod: $pod"
            kubectl -n kube-system wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$pod" --timeout=120s >/dev/null
            kubectl -n kube-system logs "$pod" | grep -vE '^#|^:|^COMMIT|^\*' | head -n 200
            kubectl -n kube-system delete pod "$pod" --wait=false >/dev/null
          done

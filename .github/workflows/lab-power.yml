name: Lab power

# The lab's power switch, by hand: stops the dev cells for a pause (a weekend) and starts them again, with
# labfw - the hub's firewall, which everything behind it needs - switched off last and on first. Nothing is
# removed and Git is not changed: the clusters keep their state (Azure keeps a stopped cluster's state for up
# to 12 months), and what the stop changes in the clusters, Flux puts back from Git on the start.
#
#   stop, per cluster:  1. every Flux configuration suspended (nothing fights the steps below);
#                       2. every Deployment and StatefulSet of the zones' namespaces (label platform/zone: the
#                          applications, the zone's gateway and ESO) scaled to 0 - their replicas kept in an
#                          annotation - and their pods waited for;
#                       3. `az aks stop`, waited for (control plane and every node pool deallocated).
#         then:         4. labfw's VM deallocated (`firewall`) - last: the cells' egress, the runners' VPN
#                          and the private names all go through it. Its public address is static, so the
#                          VPN configs stay valid.
#   start:              1. labfw's VM started and running, with a minute for its services (`firewall`);
#         per cluster:  2. `az aks start`, waited for (AKS recreates the API server's private endpoint in
#                          snet-system; the public FQDN follows it);
#                       3. what the stop scaled down scaled back (the annotation), every Flux configuration and
#                          Kustomization resumed - Flux re-applies Git's replicas within a minute - and every
#                          HelmRelease reconciled by force (a chart's replicas); the cluster autoscaler adds the
#                          zones' nodes.
#
# A failed cluster step leaves labfw on (a cluster that is not stopped keeps its firewall) and the cluster
# where it stopped: re-run after fixing - every step is idempotent. `clusters` empty with `firewall` on
# switches labfw alone.
#
# Credentials: Deploy's identity (GitHub environment `dev`: Owner and AKS RBAC Cluster Admin of sub-aks-dev;
# labfw's VM through the landing zone's custom role "OneK8s labfw Power" on its resource group) and the
# labfw VPN (peer github-runners, concurrency group labfw-vpn) for kubectl against the private API servers.
# ARM (az aks, az vm, az k8s-configuration) is public: no VPN needed for it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "stop (Flux paused, apps scaled down, clusters stopped, then labfw) or start (labfw, clusters, Flux resumed)"
        required: true
        type: choice
        options: [stop, start]
      clusters:
        description: "The clusters, space-separated (empty: none)"
        required: false
        default: "aks-dev-int-stateless-az3"
      firewall:
        description: "Also labfw's VM: deallocated last on stop, started first on start"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write # GitHub OIDC, when there is no client secret

# The labfw VPN's one runner peer (.github/actions/labfw-vpn): one such run at a time
concurrency:
  group: labfw-vpn
  cancel-in-progress: false

jobs:
  power:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 150
    env:
      ACTION: ${{ inputs.action }}
      CLUSTERS: ${{ inputs.clusters }}
      RESOURCE_GROUP: rg-aks-dev
      FIREWALL_VM: labfw-fw
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure (service principal)
        if: env.AZURE_CLIENT_SECRET != ''
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Sign in to Azure (GitHub OIDC)
        if: env.AZURE_CLIENT_SECRET == ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Tools
        run: |
          set -euo pipefail
          sudo az aks install-cli --only-show-errors >/dev/null
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=false --only-show-errors
          az extension add --name k8s-configuration --only-show-errors --upgrade
          mkdir -p "$RUNNER_TEMP/kube"
          cat > "$RUNNER_TEMP/lib.sh" <<'LIB'
          # The helpers of every cluster step. Sourced; needs RESOURCE_GROUP.
          power_state() { az aks show -g "$RESOURCE_GROUP" -n "$1" --query '[powerState.code, provisioningState]' -o tsv | tr '\n' ' '; }
          wait_cluster() { # <cluster> <power> : until powerState and provisioningState Succeeded, 20 min
            local cluster=$1 want=$2 power state i
            for i in $(seq 1 80); do
              read -r power state _ <<<"$(power_state "$cluster")"
              echo "$cluster: $power ($state)"
              [ "$power" = "$want" ] && [ "$state" = "Succeeded" ] && return 0
              [ "$state" = "Failed" ] && { echo "::error::$cluster: $state"; return 1; }
              sleep 15
            done
            echo "::error::$cluster is $power ($state), wanted $want"; return 1
          }
          kubeconfig() { # <cluster> : kubectl against it (over the VPN) as the signed-in identity
            export KUBECONFIG="$RUNNER_TEMP/kube/$1"
            [ -s "$KUBECONFIG" ] && return 0
            az aks get-credentials -g "$RESOURCE_GROUP" -n "$1" --file "$KUBECONFIG" --only-show-errors
            kubelogin convert-kubeconfig -l azurecli
          }
          flux_configurations() { az k8s-configuration flux list -g "$RESOURCE_GROUP" -c "$1" -t managedClusters --query '[].name' -o tsv; }
          flux_suspend() { # <cluster> <configuration> true|false : the CLI's `flux update --suspend` alone is refused
            # (ValidationFailed: "source kind 'GitRepository' must contain corresponding body"), so the one property is patched
            local id; id="$(az aks show -g "$RESOURCE_GROUP" -n "$1" --query id -o tsv)"
            az rest --method patch --only-show-errors -o none \
              --url "https://management.azure.com${id}/providers/Microsoft.KubernetesConfiguration/fluxConfigurations/$2?api-version=2023-05-01" \
              --body "{\"properties\":{\"suspend\":$3}}"
          }
          flux_suspend_children() { # <cluster> true|false : every Flux Kustomization in the cluster. The extension's agent copies the
            # configuration's suspend to its own Kustomization only; the ones the fleet's `platform` Kustomization creates from Git
            # (zones, tenants...) keep reconciling - and would put the replicas back - unless suspended here.
            # On the start they are set back the same way: a parent's apply does not own the field a patch set.
            local ks
            for ks in $(kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o json | jq -r --argjson want "$2" '.items[] | select((.spec.suspend // false) != $want) | .metadata.namespace + "/" + .metadata.name'); do
              kubectl -n "${ks%%/*}" patch kustomizations.kustomize.toolkit.fluxcd.io "${ks##*/}" --type merge -p "{\"spec\":{\"suspend\":$2}}" -o name
            done
          }
          wait_flux_suspended() { # <cluster> true|false : until every Flux Kustomization in the cluster says so, 5 min
            local i other
            for i in $(seq 1 20); do
              other="$(kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o json | jq -r --argjson want "$2" '[.items[] | select((.spec.suspend // false) != $want) | .metadata.namespace + "/" + .metadata.name] | join(" ")')"
              [ -z "$other" ] && { echo "$1: every Flux Kustomization suspend=$2"; return 0; }
              echo "$1: not yet suspend=$2: $other"
              sleep 15
            done
            echo "::error::$1: Flux Kustomizations not at suspend=$2: $other"; return 1
          }
          LIB

      - name: Find labfw's VM
        if: inputs.firewall
        run: |
          set -euo pipefail
          id=""
          for sub in $(az account list --query '[].id' -o tsv); do
            id="$(az vm list --subscription "$sub" --query "[?name=='$FIREWALL_VM'].id | [0]" -o tsv)"
            [ -z "$id" ] || break
          done
          [ -n "$id" ] || { echo "::error::no VM $FIREWALL_VM in any subscription the identity reads"; exit 1; }
          echo "FIREWALL_VM_ID=$id" >> "$GITHUB_ENV"
          az vm get-instance-view --ids "$id" --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv

      - name: Start labfw (first)
        if: inputs.action == 'start' && inputs.firewall
        run: |
          set -euo pipefail
          az vm start --ids "$FIREWALL_VM_ID" --output none
          for i in $(seq 1 30); do
            state="$(az vm get-instance-view --ids "$FIREWALL_VM_ID" --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv)"
            echo "$state"
            [ "$state" = "PowerState/running" ] && break
            sleep 10
          done
          [ "$state" = "PowerState/running" ] || { echo "::error::labfw is $state"; exit 1; }
          echo "running; a minute for labfw's services (DNS proxy, VPN, firewall) before the clusters need them"
          sleep 60
          echo "labfw: running" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the clusters
        if: inputs.action == 'start' && inputs.clusters != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          for cluster in $CLUSTERS; do
            state="$(power_state "$cluster")"
            echo "== $cluster: $state"
            # A re-run skips a cluster already started: Azure refuses a start of a running cluster
            case "$state" in
              Stopped*) az aks start -g "$RESOURCE_GROUP" -n "$cluster" --no-wait ;;
              *) echo "$cluster: not stopped, not started" ;;
            esac
          done
          for cluster in $CLUSTERS; do wait_cluster "$cluster" Running; done

      - name: Join the labfw VPN
        if: inputs.clusters != ''
        uses: ./.github/actions/labfw-vpn
        with:
          config: ${{ secrets.LABFW_VPN_GITHUB_RUNNERS }}

      - name: Pause Flux and scale the applications down
        if: inputs.action == 'stop' && inputs.clusters != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          for cluster in $CLUSTERS; do
            echo "== $cluster: $(power_state "$cluster")"
            for config in $(flux_configurations "$cluster"); do
              flux_suspend "$cluster" "$config" true
              echo "$cluster: Flux configuration $config suspended"
            done
            kubeconfig "$cluster"
            flux_suspend_children "$cluster" true
            wait_flux_suspended "$cluster" true
            namespaces="$(kubectl get namespaces -l platform/zone -o jsonpath='{.items[*].metadata.name}')"
            # The replicas each one had go into an annotation, which the start reads back: Flux restores only what
            # kustomize applies from Git, not a Helm chart's Deployment (the zones' gateways and ESO carry the label too).
            for ns in $namespaces; do
              for obj in $(kubectl -n "$ns" get deployments,statefulsets -o name); do
                replicas="$(kubectl -n "$ns" get "$obj" -o jsonpath='{.spec.replicas}')"
                [ "${replicas:-0}" -gt 0 ] || continue
                kubectl -n "$ns" annotate "$obj" "lab-power/replicas=$replicas" --overwrite -o name
                kubectl -n "$ns" scale "$obj" --replicas=0
              done
            done
            for i in $(seq 1 40); do
              left=0
              for ns in $namespaces; do left=$((left + $(kubectl -n "$ns" get pods --no-headers 2>/dev/null | wc -l))); done
              echo "$cluster: $left application pod(s) left in: $namespaces"
              [ "$left" -eq 0 ] && break
              sleep 15
            done
            [ "$left" -eq 0 ] || { echo "::error::$cluster: application pods still running"; exit 1; }
          done

      - name: Stop the clusters
        if: inputs.action == 'stop' && inputs.clusters != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          for cluster in $CLUSTERS; do
            echo "== $cluster: $(power_state "$cluster")"
            az aks stop -g "$RESOURCE_GROUP" -n "$cluster" --no-wait
          done
          for cluster in $CLUSTERS; do
            wait_cluster "$cluster" Stopped
            echo "$cluster: Stopped (Flux paused, applications at 0)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Deallocate labfw (last)
        if: inputs.action == 'stop' && inputs.firewall
        run: |
          set -euo pipefail
          az vm deallocate --ids "$FIREWALL_VM_ID" --output none
          az vm get-instance-view --ids "$FIREWALL_VM_ID" --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv
          echo "labfw: deallocated (the VPN and the cells' egress are off until the next start)" >> "$GITHUB_STEP_SUMMARY"

      # Starting the clusters outlasts the GitHub OIDC assertion of the first sign-in (valid about 5 minutes): kubelogin's
      # first token for a cluster then fails with AADSTS700024 (run 39105646964, 2026-10-18). Sign in again first.
      - name: Sign in to Azure again (GitHub OIDC)
        if: inputs.action == 'start' && inputs.clusters != '' && env.AZURE_CLIENT_SECRET == ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Flux resumed
        if: inputs.action == 'start' && inputs.clusters != ''
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/lib.sh"
          for cluster in $CLUSTERS; do
            for config in $(flux_configurations "$cluster"); do
              flux_suspend "$cluster" "$config" false
              echo "$cluster: Flux configuration $config resumed"
            done
            kubeconfig "$cluster"
            # What the stop scaled down comes back first (the annotation it left), then Flux resumes and re-applies Git;
            # every HelmRelease is reconciled by force, so a chart's Deployment the stop found without an annotation
            # (the run of 2026-10-16: the zones' gateways and ESO) is rendered again with its chart's replicas.
            for ns in $(kubectl get namespaces -l platform/zone -o jsonpath='{.items[*].metadata.name}'); do
              for obj in $(kubectl -n "$ns" get deployments,statefulsets -o name); do
                replicas="$(kubectl -n "$ns" get "$obj" -o jsonpath='{.metadata.annotations.lab-power/replicas}')"
                [ -n "$replicas" ] || continue
                kubectl -n "$ns" scale "$obj" --replicas="$replicas"
                kubectl -n "$ns" annotate "$obj" lab-power/replicas- -o name
              done
            done
            flux_suspend_children "$cluster" false
            wait_flux_suspended "$cluster" false
            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for hr in $(kubectl get helmreleases.helm.toolkit.fluxcd.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}'); do
              kubectl -n "${hr%%/*}" annotate helmreleases.helm.toolkit.fluxcd.io "${hr##*/}" "reconcile.fluxcd.io/requestedAt=$now" "reconcile.fluxcd.io/forceAt=$now" --overwrite -o name
            done
          done
          # What came back: Flux's first reconcile puts the replicas of Git back; the cluster autoscaler's nodes follow.
          sleep 120
          for cluster in $CLUSTERS; do
            kubeconfig "$cluster"
            echo "== $cluster: $(power_state "$cluster")"
            for ns in $(kubectl get namespaces -l platform/zone -o jsonpath='{.items[*].metadata.name}'); do
              kubectl -n "$ns" get deployments,statefulsets 2>/dev/null || true
            done
            kubectl get nodes -o wide
            echo "$cluster: Running (Flux resumed - the applications and the zones' nodes follow within minutes)" >> "$GITHUB_STEP_SUMMARY"
          done

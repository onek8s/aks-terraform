name: Lab examples

# The design site's lab examples (onek8s.github.io examples/lab/): the test applications that run in the lab, one page
# per isolation zone with a section per application and an index - generated by the documentation agent of
# onek8s/aks-ai-agents (`aks-agent docs lab`) from Git alone: this repository's cell tfvars, the landing zone's
# firewall rule files, the fleet's zones and allow-lists, the applications' Flux configuration (aks-fluxcd-example)
# and their source repositories (aks-hello). Deterministic: no model, no cluster, no Azure, no VPN.
#
#   generate  writes the pages into a checkout of onek8s.github.io (examples/lab/; the command owns every page there)
#             and prints the findings. Nothing changed: the run ends here.
#   pull      only when a page changed and dry_run is off: commits examples/lab/ alone to the branch agent/lab-examples
#   request   (force-pushed, from the site's main) with GH_OWNER and opens the pull request `Lab examples: <spoke>`, or
#             updates the open one. The workflow never merges: the user does.
#
# By hand only (the user runs it when the lab's applications changed). The pages carry no timestamp, so a run after
# nothing changed opens nothing; the generated pages are an artifact of every run.

on:
  workflow_dispatch:
    inputs:
      spoke:
        description: "The exposure to document: <env>-<exposure>"
        default: "dev-int"
      dry_run:
        description: "Generate the pages and print the findings only; no pull request"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lab-examples
  cancel-in-progress: false

jobs:
  docs:
    name: lab examples
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - name: Check the inputs
        env:
          SPOKE: ${{ inputs.spoke || 'dev-int' }}
        run: |
          [[ "$SPOKE" =~ ^[a-z0-9]+-[a-z0-9]+$ ]] || { echo "::error::spoke must be <env>-<exposure>, e.g. dev-int"; exit 1; }

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: onek8s/aks-ai-agents
          path: aks-ai-agents

      - uses: actions/checkout@v7
        with:
          repository: onek8s/azure-landing-zone
          path: azure-landing-zone

      - uses: actions/checkout@v7
        with:
          repository: onek8s/aks-fluxcd-platform
          path: aks-fluxcd-platform

      - uses: actions/checkout@v7
        with:
          repository: onek8s/aks-fluxcd-example
          path: aks-fluxcd-example

      - uses: actions/checkout@v7
        with:
          repository: onek8s/aks-hello
          path: aks-hello

      # GH_OWNER pushes the branch of the pull request
      - uses: actions/checkout@v7
        with:
          repository: onek8s/onek8s.github.io
          path: onek8s.github.io
          token: ${{ secrets.GH_OWNER }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No kustomize: the agents' own small build reads the application overlays as kustomize does
      - name: Install the agents
        run: pip install --quiet ./aks-ai-agents

      - name: Generate the pages
        id: generate
        env:
          AKS_AGENT_PLATFORM: aks-ai-agents/config/onek8s-dev.yaml
          AKS_AGENT_ENV: dev
          AKS_AGENT_GITHUB_TOKEN: ${{ secrets.GH_OWNER }}
          SPOKE: ${{ inputs.spoke || 'dev-int' }}
        run: |
          set -euo pipefail
          aks-agent docs lab --spoke "$SPOKE" --github \
            --landing-zone azure-landing-zone --fleet aks-fluxcd-platform --iac . \
            --app-repo onek8s/aks-fluxcd-example=aks-fluxcd-example \
            --app-source onek8s/aks-hello=aks-hello \
            --site onek8s.github.io | tee "$RUNNER_TEMP/generate.txt"
          {
            echo '### Lab examples'
            echo '```'; cat "$RUNNER_TEMP/generate.txt"; echo '```'
            echo '```'; git -C onek8s.github.io status --short --untracked-files=all; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lab-examples
          path: onek8s.github.io/examples/lab
          retention-days: 30

      - name: Pull request
        if: steps.generate.outputs.changed != '0' && !inputs.dry_run
        working-directory: onek8s.github.io
        env:
          GH_TOKEN: ${{ secrets.GH_OWNER }}
          SPOKE: ${{ inputs.spoke || 'dev-int' }}
          BRANCH: agent/lab-examples
        run: |
          set -euo pipefail
          # The generator writes examples/lab/ only; anything else changed is a fault, never committed
          outside="$(git status --porcelain --untracked-files=all | cut -c4- | sed 's/.* -> //' | grep -v '^examples/lab/' || true)"
          if [ -n "$outside" ]; then
            echo "::error::Changed outside examples/lab/: $outside"
            exit 1
          fi
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Nothing changed in examples/lab/" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "onek8s-documentation-agent"
          git config user.email "documentation-agent@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A examples/lab
          git commit -q -m "Lab examples: $SPOKE" \
            -m "Generated by the documentation agent of onek8s/aks-ai-agents (aks-agent docs lab) from Git, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          git push --force origin "$BRANCH"
          body="$(cat <<EOF
          The lab examples of the spoke \`$SPOKE\` (\`examples/lab/\`), regenerated by the documentation agent of onek8s/aks-ai-agents (\`aks-agent docs lab\`) from Git alone: aks-terraform's cells, azure-landing-zone's firewall rule files, aks-fluxcd-platform's zones and allow-lists, aks-fluxcd-example's Flux configuration and aks-hello's source. No model, no cluster.

          The pages are generated: do not edit them here, change the sources and run aks-terraform's **Lab examples** workflow again. They are not part of the requirements or the design and are in neither PDF. Only \`examples/lab/\` changes.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          \`\`\`
          $(cat "$RUNNER_TEMP/generate.txt")
          \`\`\`
          EOF
          )"
          number="$(gh pr list --repo onek8s/onek8s.github.io --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo onek8s/onek8s.github.io --title "Lab examples: $SPOKE" --body "$body"
            url="$(gh pr view "$number" --repo onek8s/onek8s.github.io --json url --jq .url)"
          else
            url="$(gh pr create --repo onek8s/onek8s.github.io --base main --head "$BRANCH" --title "Lab examples: $SPOKE" --body "$body")"
          fi
          echo "Pull request (for the user to merge): $url" >> "$GITHUB_STEP_SUMMARY"

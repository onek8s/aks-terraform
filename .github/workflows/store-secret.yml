name: Store secret

# Puts a secret into the platform vault without its value ever being in Git, in a workflow input or
# in a log. Workflow inputs are readable by anyone who can read the repository, so the value travels
# encrypted to a key that never leaves the vault:
#
#   1. `public-key`: makes sure the vault has the RSA key `secret-transport` (decrypt and encrypt only)
#      and prints its public key.
#   2. Encrypt the value with it, anywhere:
#        openssl pkeyutl -encrypt -pubin -inkey secret-transport.pem \
#          -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
#          -in value -out value.enc && base64 -w0 value.enc
#      (RSA-OAEP-256, 4096-bit key: at most 446 bytes of value.)
#   3. `store`: with that ciphertext and the secret's name; Key Vault decrypts it and the workflow
#      stores it as the secret. Only the name and the new version are printed.
#
# Names follow the vault's share convention, `<namespace>--<name>` (aks-terraform key_vault_namespaces).
#
# Credentials: the same Azure identity and GitHub environment as Deploy, which holds Key Vault
# Administrator on the subscription.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "public-key prints the transport key; store decrypts the ciphertext into the secret"
        required: true
        type: choice
        options: [public-key, store]
      name:
        description: "store: the secret's name, <namespace>--<name>"
        required: false
        default: ""
      ciphertext:
        description: "store: the value encrypted to the transport key (RSA-OAEP-256), base64"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  secret:
    name: ${{ inputs.action }} ${{ inputs.name }}
    runs-on: ubuntu-latest
    environment: dev
    # The labfw VPN's runner peer (.github/actions/labfw-vpn): one such run at a time
    concurrency:
      group: labfw-vpn
      cancel-in-progress: false
    env:
      VAULT: kv-onek8s-gwc-platform
      KEY: secret-transport
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The vault (no public network access), through the hub firewall's VPN
      - uses: ./.github/actions/labfw-vpn
        with:
          config: ${{ secrets.LABFW_VPN_GITHUB_RUNNERS }}

      - name: Transport key
        if: inputs.action == 'public-key'
        run: |
          set -euo pipefail
          if ! az keyvault key show --vault-name "$VAULT" --name "$KEY" -o none 2>/dev/null; then
            az keyvault key create --vault-name "$VAULT" --name "$KEY" --kty RSA --size 4096 \
              --ops encrypt decrypt -o none
          fi
          az keyvault key download --vault-name "$VAULT" --name "$KEY" --encoding PEM --file "$RUNNER_TEMP/$KEY.pem"
          cat "$RUNNER_TEMP/$KEY.pem"
          { echo "### $KEY ($VAULT)"; echo; echo '```'; cat "$RUNNER_TEMP/$KEY.pem"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Store
        if: inputs.action == 'store'
        env:
          NAME: ${{ inputs.name }}
          CIPHERTEXT: ${{ inputs.ciphertext }}
        run: |
          set -euo pipefail
          [[ "$NAME" =~ ^[a-z0-9-]+--[a-z0-9-]+$ ]] || { echo "::error::name must be <namespace>--<name>"; exit 1; }
          [ -n "$CIPHERTEXT" ] || { echo "::error::ciphertext is empty"; exit 1; }
          plain="$(az keyvault key decrypt --vault-name "$VAULT" --name "$KEY" --algorithm RSA-OAEP-256 \
            --value "$CIPHERTEXT" --data-type base64 --query result -o tsv)"
          echo "::add-mask::$plain"
          umask 077
          base64 -d <<<"$plain" > "$RUNNER_TEMP/value"
          version="$(az keyvault secret set --vault-name "$VAULT" --name "$NAME" --file "$RUNNER_TEMP/value" \
            --query id -o tsv | sed 's#.*/##')"
          rm -f "$RUNNER_TEMP/value"
          echo "Stored $NAME in $VAULT, version $version"
          echo "Stored \`$NAME\` in $VAULT, version \`$version\`." >> "$GITHUB_STEP_SUMMARY"

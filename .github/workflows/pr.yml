name: PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the lower bound of required_version in terraform.tf.
  TERRAFORM_VERSION: "1.14.4"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Format, validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # No backend and no credentials: this only has to resolve the providers and the module.
      - name: Initialize
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      # The providers are mocked in the suite, so this reaches no Azure subscription.
      - name: Test
        run: terraform test

      # The environment's shared resources, a root module of their own.
      - name: Initialize shared/
        working-directory: shared
        run: terraform init -backend=false -input=false

      - name: Validate shared/
        working-directory: shared
        run: terraform validate

      - name: Test shared/
        working-directory: shared
        run: terraform test

  plan-risk:
    name: Plan risk rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The rules Deploy runs on every plan (plan-risk/risk.rego), against their tests.
      - name: Install conftest
        env:
          CONFTEST_VERSION: "0.62.0" # keep in step with deploy.yml
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP" conftest
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          cp -r plan-risk "$RUNNER_TEMP/plan-risk-fmt"
          conftest fmt "$RUNNER_TEMP/plan-risk-fmt"
          diff -r plan-risk "$RUNNER_TEMP/plan-risk-fmt"

      - name: Test
        run: conftest verify --policy plan-risk --no-color

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed from the pinned release rather than through an action, so that the version in the
      # workflow is the version that runs.
      - name: Install tflint
        env:
          TFLINT_VERSION: v0.60.0
        run: |
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/tflint.zip" \
            "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          unzip -o "${RUNNER_TEMP}/tflint.zip" -d "${RUNNER_TEMP}/tflint"
          echo "${RUNNER_TEMP}/tflint" >> "${GITHUB_PATH}"

      - name: Install the rulesets pinned in .tflint.hcl
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint
        run: tflint --format=compact

      - name: Lint shared/
        run: tflint --chdir=shared --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

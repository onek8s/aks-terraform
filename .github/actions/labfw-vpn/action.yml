# Joins a GitHub-hosted runner to the hub firewall's (labfw's) WireGuard VPN, so that it reaches what has no
# public endpoint: the dev cells' private API servers (Private Link endpoints in their system subnets, OneK8s
# design section 2.2, D58) and the private endpoints of the environment's services - the vaults, the registry,
# Foundry and the Terraform state (shared/ snet-shared-pe) and Azure Monitor (the hub's Private Link scope in the
# management network's snet-pe).
#
# The client config is a secret of the `dev` environment, passed as `config` (LABFW_VPN_GITHUB_RUNNERS, or
# LABFW_VPN_GITHUB_DEPLOY for Deploy; set by the VPN clients workflow): the vaults are private, so the VPN's
# own credential cannot come from one. Without `config` the platform vault's `labfw-vpn--github-runners` is read
# (the runner must be signed in to Azure), which works only while the vault still answers publicly.
#
# Names: the API servers' public FQDNs resolve to their private addresses, but a private endpoint's name does
# only through the hub's private link zones, which labfw's DNS proxy (10.0.12.1) answers from. The names in
# `private_names` are looked up there and, when the answer is private, pinned in /etc/hosts - everything else the
# runner resolves as before.
#
# One peer per config: WireGuard follows a peer to its latest endpoint, so two runners on one peer at once take
# it from each other. The workflows on github-runners share the concurrency group `labfw-vpn`; Deploy has its own.
name: labfw VPN
description: Join the runner to the labfw VPN (private API servers and private endpoints)
inputs:
  config:
    description: The WireGuard client config (a secret); empty reads it from the vault
    default: ""
  vault:
    description: Without config, the vault holding it
    default: kv-onek8s-gwc-platform
  secret:
    description: Without config, the secret holding it
    default: labfw-vpn--github-runners
  extra_allowed_ips:
    description: >-
      Routes added to the config's AllowedIPs (comma-separated): az3's system subnet (its API server's endpoint) and
      int-se's slot (its internal load balancer) in 10.100.0.0/16 and its pod subnets in 100.64.0.0/16 (design D74), labfw's DNS proxy, the environment's private endpoints (shared/
      snet-shared-pe) and the management network's (snet-pe: Azure Monitor Private Link scope)
    default: 10.100.0.0/24, 10.100.2.0/24, 100.64.0.0/20, 100.64.16.0/20, 100.64.32.0/20, 10.0.12.1/32, 172.20.2.0/26, 10.0.8.128/26
  private_names:
    description: >-
      DNS names looked up at labfw's DNS proxy, space-separated: the private endpoints' services. Exact names
      on purpose - a whole suffix such as blob.core.windows.net would also send other accounts' names to the
      hub's private zones, where an account with a private endpoint elsewhere does not resolve. Not the
      registry: Basic in dev, on its public endpoint (design D62).
    default: >-
      kv-onek8s-gwc-platform.vault.azure.net kv-onek8s-gwc-int-fi.vault.azure.net kv-onek8s-gwc-int-se.vault.azure.net
      ais-onek8s-dev-agents.cognitiveservices.azure.com ais-onek8s-dev-agents.openai.azure.com
      ais-onek8s-dev-agents.services.ai.azure.com stonek8sdevtfstate.blob.core.windows.net
      api.loganalytics.io api.loganalytics.azure.com
runs:
  using: composite
  steps:
    - name: Join the labfw VPN
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        VAULT: ${{ inputs.vault }}
        SECRET: ${{ inputs.secret }}
        EXTRA_ALLOWED_IPS: ${{ inputs.extra_allowed_ips }}
        PRIVATE_NAMES: ${{ inputs.private_names }}
      run: |
        set -euo pipefail
        command -v wg-quick >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools >/dev/null; }
        umask 077
        if [ -n "$CONFIG" ]; then
          printf '%s\n' "$CONFIG" > "$RUNNER_TEMP/labfw.conf"
        else
          az keyvault secret show --vault-name "$VAULT" --name "$SECRET" --query value -o tsv > "$RUNNER_TEMP/labfw.conf"
        fi
        [ -z "$EXTRA_ALLOWED_IPS" ] || sed -i -E "s|^(AllowedIPs *= *.*)$|\1, ${EXTRA_ALLOWED_IPS//,/, }|" "$RUNNER_TEMP/labfw.conf"
        sudo install -m 600 "$RUNNER_TEMP/labfw.conf" /etc/wireguard/labfw.conf
        rm -f "$RUNNER_TEMP/labfw.conf"
        sudo wg-quick up labfw
        # The tunnel is up once labfw answered a handshake
        for _ in $(seq 1 15); do
          [ "$(sudo wg show labfw latest-handshakes | awk '{print $2}')" != "0" ] && break
          sleep 2
        done
        sudo wg show labfw | grep -E 'endpoint|allowed ips|latest handshake' || true
        # The private endpoints' names as labfw's DNS proxy answers them (the hub's private link zones), pinned in
        # /etc/hosts for this job: the runner's own resolver keeps answering everything else - systemd-resolved's
        # routing domains did not take effect on the runner
        if [ -n "$PRIVATE_NAMES" ]; then
          for name in $PRIVATE_NAMES; do
            address="$(dig +short +time=3 +tries=2 @10.0.12.1 "$name" | grep -E '^[0-9.]+$' | tail -1 || true)"
            if [[ "$address" =~ ^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.) ]]; then
              echo "$address $name" | sudo tee -a /etc/hosts >/dev/null
              echo "$name -> $address (private)"
            else
              echo "$name -> ${address:-no answer} (public or none: resolved as before)"
            fi
          done
        fi

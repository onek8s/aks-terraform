# What the Resource Graph check of the Isolation tests workflow (check-public-endpoints.py) allows:
# the designed public endpoints, and the dev lab's recorded exceptions with their reason. Anything
# else public, or with local authentication on, fails the run. Fields are regular expressions
# (case-insensitive, whole value); `check` is public-ip, public-endpoint or local-auth.
#
# Since 2026-10-15 (design D60, the user's ask: no public endpoints) the vaults, Foundry, the Terraform
# state and the Log Analytics workspaces take no public network access - they are reached through
# private endpoints, the GitHub-hosted runners over the labfw VPN - and the API servers are private
# (D58). The registry is the exception since 2026-10-16 (D62): a non-production registry is Basic,
# which Azure offers no private endpoint for. What remains is below.
allowed:
  # Design D62: a non-production registry is Basic on its public endpoint, Entra ID only (the local-auth
  # check still fails on an admin user); prd's registry alone is Premium with a private endpoint
  - check: public-endpoint
    type: microsoft.containerregistry/registries
    name: acronek8sdev
    reason: "Non-production registry: Basic (D62), no private endpoint below Premium; Entra ID only"
  # Designed (design sections 3.1 and 4.1): the external zones' gateways are published on a public load
  # balancer in every cell; AKS creates its frontend IPs in the node resource group. The internal cells
  # (the lab) have none: their outbound goes through the hub (userDefinedRouting).
  - check: public-ip
    resourceGroup: mc_rg-aks-dev_aks-dev-ext-stateless-az[0-9]+_.*
    reason: "AKS load balancer: the ext-* zones' gateways (designed)"
  # AKS-managed: the Flux extension's Private Link scope in the node resource group, which AKS creates
  # with public network access and manages itself
  - check: public-endpoint
    type: microsoft.kubernetesconfiguration/privatelinkscopes
    resourceGroup: mc_rg-aks-dev_.*
    reason: "AKS-managed (node resource group): the cluster extensions' Private Link scope, not configurable"
  # AKS-managed: the nodes' OS disks, created with each VM (NAP's too) - a disk's public network access is
  # only export and import over a SAS URL, which needs a role on the node resource group, and AKS offers no
  # setting for it (an Azure Policy on disks never sees them: they are created inside the VM's request)
  - check: public-endpoint
    type: microsoft.compute/disks
    resourceGroup: mc_rg-aks-dev_.*
    reason: "AKS-managed node OS disks: export/import only with rights on the node resource group; no setting"

# Testers of managed_namespaces[*].groups, for check-namespace-access.py (Isolation tests, R6): per
# namespace and role, the client ID of an Entra ID application that is a member of that role's group
# and has a federated credential for this repository's GitHub environment `dev`
# (repo:onek8s/aks-terraform:environment:dev). The test signs in as it with the workflow's OIDC token
# and calls the cell as a real member of the group. A role without a tester is checked by
# impersonation only (AUDIT). Client IDs are not secrets.
#
#   testers:
#     ext-fi-example:
#       view: 00000000-0000-0000-0000-000000000000
testers:
  # onek8s-dev-ext-fi-example-<role>-tester, members of grp-onek8s-dev-ext-fi-example-<role>.
  ext-fi-example:
    view: 80222536-1bf3-4ef8-8384-8a5eec4131bf
    edit: bd3f5bba-4bea-4790-b859-b0b03c13c33d
    admin: c98bc085-8729-42aa-b8db-99d84caa8ca5
  # onek8s-dev-platform-viewers-tester, a member of grp-onek8s-dev-platform-viewers (shared/
